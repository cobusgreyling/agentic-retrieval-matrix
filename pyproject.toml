[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-retrieval-matrix"
version = "0.2.0"
description = "Factorial benchmark for agentic search: retriever × delivery × harness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cobus Greyling", email = "7868717+cobusgreyling@users.noreply.github.com" }]
keywords = ["agents", "rag", "grep", "benchmark", "longmemeval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
vector = ["numpy>=1.26", "faiss-cpu>=1.8", "sentence-transformers>=3.0"]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/cobusgreyling/agentic-retrieval-matrix"
Repository = "https://github.com/cobusgreyling/agentic-retrieval-matrix"
Paper = "https://arxiv.org/abs/2605.15184"
"Bug Tracker" = "https://github.com/cobusgreyling/agentic-retrieval-matrix/issues"

[project.scripts]
arm = "agentic_retrieval_matrix.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_retrieval_matrix"]

[tool.hatch.build.targets.sdist]
include = ["src/agentic_retrieval_matrix", "examples", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]